# Grades a challenge submission.
#
# This workflow runs for pull requests, including PRs from forks, so it has a
# read-only token and no secrets. It checks out the grader from main, never
# the PR, and copies only the challenge's solution files out of the PR's head
# commit through the API. It writes result.json as an artifact; the Report workflow reads it,
# checks it against the PR, and comments.
name: Grade

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: grade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  grade:
    name: Grade the submission
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the grader from main, compare the PR commit and read its solution files
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the grader from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Copy the solution files out of the PR
        id: prepare
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/prepare.py

      - name: Run the checks
        if: steps.prepare.outputs.graded == 'true'
        timeout-minutes: 25
        env:
          CHALLENGE: ${{ steps.prepare.outputs.challenge }}
        run: bash scripts/grade.sh

      - name: Write the result
        if: always()
        timeout-minutes: 1
        run: python3 scripts/result.py

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grade-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grade/result.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Show the result
        if: always()
        timeout-minutes: 1
        run: python3 scripts/result.py --exit-code
